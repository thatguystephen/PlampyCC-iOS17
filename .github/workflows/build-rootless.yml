name: Rootless Theos package
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app
  THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
  SDK_COMMIT: 146e41ff2c292168388929e43c9b4de2f00e36b3
  SDK_NAME: iPhoneOS16.5.sdk
  SDK_SHA256: 5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb
jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Checkout source # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Bun # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.20
      - name: Verify Apple Silicon runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          printf 'Runner architecture: '
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --find clang
          xcrun clang --version
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Install pinned Theos and SDK
        env:
          THEOS: "${{ runner.temp }}/theos"
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_COMMIT"
          grep -F 'THEOS_PACKAGE_INSTALL_PREFIX = /var/jb' "$THEOS/vendor/mod/rootless/package.mk"
          grep -F '#define ROOT_PATH_NS(path) @THEOS_PACKAGE_INSTALL_PREFIX path' "$THEOS/vendor/include/rootless.h"
          grep -F '_THEOS_SCHEME_STAGE = $(_THEOS_STAGING_TMP)$(THEOS_PACKAGE_INSTALL_PREFIX)' "$THEOS/makefiles/common.mk"
          grep -F 'rsync -a "$(THEOS_LAYOUT_DIR_NAME)/" "$(THEOS_STAGING_DIR)"' "$THEOS/makefiles/stage.mk"
          grep -F '$(shell mv $(i) $(_THEOS_SCHEME_STAGE))' "$THEOS/makefiles/package/deb.mk"
          grep -F 'TARGET_STRIP = :' "$THEOS/makefiles/common.mk"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$SDK_NAME.tar.xz" "https://github.com/theos/sdks/releases/download/master-146e41f/$SDK_NAME.tar.xz"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_NAME.tar.xz" | shasum -a 256 -c -
          mkdir -p "$THEOS/sdks" && tar -xJf "$RUNNER_TEMP/$SDK_NAME.tar.xz" -C "$THEOS/sdks"
          printf 'THEOS=%s\n' "$THEOS" >> "$GITHUB_ENV"
      - name: Build and emit verifier contract
        run: |
          set -euo pipefail
          make clean stage FINALPACKAGE=0 STRIP=0 THEOS_PACKAGE_SCHEME=rootless
          rm -rf dist
          mkdir -p dist/packages dist/symbols/arm64 dist/symbols/arm64e
          collect_unstripped() {
            arch="$1"
            target="$2"
            output="$3"
            candidates=()
            while IFS= read -r candidate; do candidates+=("$candidate"); done < <(find .theos -type f -path "*/$arch/*" -name "$target" ! -path '*/.dSYM/*' -print)
            test "${#candidates[@]}" -eq 1
            test -s "${candidates[0]}"
            cp "${candidates[0]}" "$output"
            test -s "$output"
          }
          for arch in arm64 arm64e; do
            collect_unstripped "$arch" PlampyCC.dylib "dist/symbols/$arch/PlampyCC.dylib"
            collect_unstripped "$arch" PlampyCC "dist/symbols/$arch/PlampyCC"
          done
          test "$(find dist/symbols -type f | wc -l | tr -d ' ')" -eq 4
          make clean package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=rootless
          find packages -type f -name '*.deb' -exec cp {} dist/packages/ \;
          test "$(find dist/packages -type f -name '*.deb' | wc -l | tr -d ' ')" -eq 1
          git rev-parse HEAD > dist/source-commit.txt
          xcodebuild -version > dist/xcode-version.txt
          {
            printf 'architecture: '
            uname -m
            sw_vers
            xcodebuild -version
            xcrun clang --version
          } > dist/toolchain.txt
          python3 .github/workflows/emit-manifest.py
          (cd dist && find packages symbols source-commit.txt xcode-version.txt toolchain.txt -type f -print | sort | xargs shasum -a 256 > SHA256SUMS)
      - name: Upload package, provenance, and symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plampycc-rootless-package
          path: dist/
          if-no-files-found: error
