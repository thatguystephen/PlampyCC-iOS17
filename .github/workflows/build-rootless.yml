name: Rootless Theos package
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app
  THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
  SDK_COMMIT: 146e41ff2c292168388929e43c9b4de2f00e36b3
  SDK_NAME: iPhoneOS16.5.sdk
  SDK_SHA256: 5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb
jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Checkout source # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Bun # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.20
      - name: Verify Apple Silicon runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          printf 'Runner architecture: '
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --find clang
          xcrun clang --version
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Install pinned Theos and SDK
        env:
          THEOS: "${{ runner.temp }}/theos"
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_COMMIT"
          grep -F 'THEOS_PACKAGE_INSTALL_PREFIX = /var/jb' "$THEOS/vendor/mod/rootless/package.mk"
          grep -F '#define ROOT_PATH_NS(path) @THEOS_PACKAGE_INSTALL_PREFIX path' "$THEOS/vendor/include/rootless.h"
          grep -F '_THEOS_SCHEME_STAGE = $(_THEOS_STAGING_TMP)$(THEOS_PACKAGE_INSTALL_PREFIX)' "$THEOS/makefiles/common.mk"
          grep -F 'rsync -a "$(THEOS_LAYOUT_DIR_NAME)/" "$(THEOS_STAGING_DIR)"' "$THEOS/makefiles/stage.mk"
          grep -F '$(shell mv $(i) $(_THEOS_SCHEME_STAGE))' "$THEOS/makefiles/package/deb.mk"
          grep -F 'TARGET_STRIP = :' "$THEOS/makefiles/common.mk"
          grep -F 'TARGET_CODESIGN = ldid' "$THEOS/makefiles/targets/_common/darwin_head.mk"
          grep -F 'TARGET_CODESIGN_FLAGS ?= -S' "$THEOS/makefiles/targets/_common/darwin_head.mk"
          grep -F '_THEOS_CODESIGN_COMMANDLINE = CODESIGN_ALLOCATE=$(TARGET_CODESIGN_ALLOCATE) $(ECHO_UNBUFFERED) $(TARGET_CODESIGN)' "$THEOS/makefiles/instance/rules.mk"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$SDK_NAME.tar.xz" "https://github.com/theos/sdks/releases/download/master-146e41f/$SDK_NAME.tar.xz"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_NAME.tar.xz" | shasum -a 256 -c -
          mkdir -p "$THEOS/sdks" && tar -xJf "$RUNNER_TEMP/$SDK_NAME.tar.xz" -C "$THEOS/sdks"
          printf 'THEOS=%s\n' "$THEOS" >> "$GITHUB_ENV"
      - name: Build and emit verifier contract
        run: |
          set -euo pipefail
          python3 -B tests/caml-diagnostic-contract.py
          bun tests/static-check.ts
          python3 -B tests/signature-contract.py
          # Build the exact release binary once without stripping. The package is
          # then copied, stripped in place, and repacked so UUIDs and function
          # starts remain identical between each companion and final slice.
          make clean package FINALPACKAGE=1 STRIP=0 THEOS_PACKAGE_SCHEME=rootless
          rm -rf dist
          mkdir -p dist/packages dist/symbols/arm64 dist/symbols/arm64e "$RUNNER_TEMP/plampycc-package"
          source_package="$(find packages -type f -name '*.deb' -print -quit)"
          test -n "$source_package"
          dpkg-deb -R "$source_package" "$RUNNER_TEMP/plampycc-package"
          release_dylib="$(find "$RUNNER_TEMP/plampycc-package" -type f -name 'PlampyCC.dylib' -print -quit)"
          source_dylib=""
          while IFS= read -r candidate; do
            if nm -a "$candidate" | grep -q 'CAMLButtonPackageHook'; then source_dylib="$candidate"; break; fi
          done < <(find .theos/obj/arm64 -type f -name 'PlampyCC.dylib' -print)
          source_preferences="$(find "$RUNNER_TEMP/plampycc-package" -type f -name 'PlampyCC' -print -quit)"
          test -n "$release_dylib" && test -n "$source_dylib" && test -n "$source_preferences"
          for target in PlampyCC.dylib PlampyCC; do
            if [ "$target" = PlampyCC.dylib ]; then source_binary="$release_dylib"; else source_binary="$source_preferences"; fi
            for arch in arm64 arm64e; do
              if [ "$target" = PlampyCC.dylib ]; then
                symbol_binary=""
                while IFS= read -r candidate; do
                  if nm -a "$candidate" | grep -q 'CAMLButtonPackageHook'; then symbol_binary="$candidate"; break; fi
                done < <(find ".theos/obj/$arch" -type f -name 'PlampyCC.dylib' -print)
              else
                symbol_binary="$source_preferences"
              fi
              test -n "$symbol_binary"
              if [ "$target" = PlampyCC.dylib ]; then cp "$symbol_binary" "dist/symbols/$arch/$target"; else lipo "$symbol_binary" -thin "$arch" -output "dist/symbols/$arch/$target"; fi
              test -s "dist/symbols/$arch/$target"
            done
            strip -x "$source_binary"
          done
          # strip -x above invalidates the build-time signature (the pinned
          # Theos signs every linked binary with ldid -S through
          # _THEOS_CODESIGN_COMMANDLINE). Re-sign every final staged Mach-O
          # with the exact pinned signing step after stripping and before
          # dpkg-deb -b; nothing may mutate these bytes afterwards.
          : > "$RUNNER_TEMP/plampycc-signed.txt"
          while IFS= read -r staged_file; do
            if file -b "$staged_file" | grep -q 'Mach-O'; then
              ldid -S "$staged_file"
              printf '%s\n' "$staged_file" >> "$RUNNER_TEMP/plampycc-signed.txt"
            fi
          done < <(find "$RUNNER_TEMP/plampycc-package" -type f | sort)
          test -s "$RUNNER_TEMP/plampycc-signed.txt"
          test "$(find dist/symbols -type f | wc -l | tr -d ' ')" -eq 4
          dpkg-deb -b "$RUNNER_TEMP/plampycc-package" "dist/packages/$(basename "$source_package")"
          test "$(find dist/packages -type f -name '*.deb' | wc -l | tr -d ' ')" -eq 1
          # Final-signature gate: every packaged Mach-O must still be the exact
          # byte sequence signed above (no post-sign mutation) and must carry a
          # hash-valid code signature over its final stripped content.
          rm -rf "$RUNNER_TEMP/plampycc-verify"
          mkdir -p "$RUNNER_TEMP/plampycc-verify"
          dpkg-deb -R "dist/packages/$(basename "$source_package")" "$RUNNER_TEMP/plampycc-verify"
          python3 -B tests/signature-contract.py --package "dist/packages/$(basename "$source_package")"
          verified_signatures=0
          while IFS= read -r packaged_file; do
            if file -b "$packaged_file" | grep -q 'Mach-O'; then
              relative="${packaged_file#"$RUNNER_TEMP/plampycc-verify"}"
              cmp "$packaged_file" "$RUNNER_TEMP/plampycc-package$relative"
              verified_signatures=$((verified_signatures + 1))
            fi
          done < <(find "$RUNNER_TEMP/plampycc-verify" -type f | sort)
          test "$verified_signatures" -eq "$(wc -l < "$RUNNER_TEMP/plampycc-signed.txt" | tr -d ' ')"
          git rev-parse HEAD > dist/source-commit.txt
          xcodebuild -version > dist/xcode-version.txt
          {
            printf 'architecture: '
            uname -m
            sw_vers
            xcodebuild -version
            xcrun clang --version
          } > dist/toolchain.txt
          python3 .github/workflows/emit-manifest.py
          (cd dist && find packages symbols source-commit.txt xcode-version.txt toolchain.txt build-manifest.json -type f -print | sort | xargs shasum -a 256 > SHA256SUMS)
          python3 -B tests/caml-diagnostic-artifact.py dist
      - name: Upload package, provenance, and symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plampycc-rootless-package
          path: dist/
          if-no-files-found: error
